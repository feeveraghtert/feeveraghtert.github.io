<script>
(function(){
  function installFallbacks(){
    document.querySelectorAll('img[data-fallbacks]').forEach(function(img){
      var list = img.getAttribute('data-fallbacks').split('|');
      var i = 0;
      img.onerror = function(){ if(i < list.length){ img.src = list[i++]; } };
    });
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', installFallbacks); else installFallbacks();
})();
